    <script>
        let curLvl = 1, totalLvls = 40, actx = null;
        const txts = [
            "Ты невероятно прекрасна! ❤️",
            "Твоя улыбка завораживает 🥰",
            "Рядом с тобой тепло 🌹",
            "Ты удивительная девушка ✨",
            "Ты заслуживаешь лучшего! 💖"
        ];
        function snd(f, d) {
            try {
                if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
                let o = actx.createOscillator(), g = actx.createGain();
                o.frequency.setValueAtTime(f, actx.currentTime);
                g.gain.setValueAtTime(0.1, actx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
                o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
            } catch(e) {}
        }
        function triggerVibe() { if (navigator.vibrate) navigator.vibrate(15); }
        function startLvl() {
            const zone = document.getElementById('g-zone');
            const instEl = document.getElementById('g-instr');
            const compEl = document.getElementById('g-comp');
            const nextBtn = document.getElementById('g-next');
            const countEl = document.getElementById('g-counter');
            countEl.innerText = `Уровень ${curLvl} из ${totalLvls}`;
            compEl.classList.add('hidden'); nextBtn.classList.add('hidden'); zone.innerHTML = '';
            let mech = (curLvl === totalLvls) ? 4 : (curLvl - 1) % 4;
            instEl.innerText = (curLvl === totalLvls) ? "Приложи палец для анализа" : "Поймай бегающую искорку";
            if(curLvl === totalLvls) {
                let line = document.createElement('div'); line.className = 'scan-line';
                let finger = document.createElement('div'); finger.style = "width:74px; height:94px; border:2px dashed #00d2ff; border-radius:37px; display:flex; justify-content:center; align-items:center; color:#00d2ff; font-weight:bold; font-size:0.8rem; cursor:pointer; background:rgba(0,210,255,0.05); z-index:5;"; finger.innerText = "HOLD";
                zone.appendChild(line); zone.appendChild(finger); let p = 0, iv = null;
                function startS() { line.style.display = 'block'; snd(200, 2); iv = setInterval(() => { if(p < 100) { p += 4; finger.innerText = `${p}%`; finger.style.background = `rgba(57,255,14,${p/200})`; } else { clearInterval(iv); line.style.display = 'none'; finger.style.display = 'none'; instEl.style.display = 'none'; onWin(); } }, 80); }
                function stopS() { clearInterval(iv); line.style.display = 'none'; p = 0; finger.innerText = 'HOLD'; finger.style.background = 'rgba(0,210,255,0.05)'; }
                finger.onmousedown = finger.ontouchstart = (e) => { e.preventDefault(); startS(); }; finger.onmouseup = finger.ontouchend = () => stopS();
            } else {
                let d = document.createElement('div'); d.className = 't-dot'; zone.appendChild(d); let a = Math.random() * 360, speed = 0.04 + (Math.random() * 0.03);
                function L() { if(curLvl === totalLvls) return; if(!d.parentNode) return; a += speed; d.style.left = `${50 + Math.cos(a) * 35}%`; d.style.top = `${50 + Math.sin(a) * 35}%`; requestAnimationFrame(L); } L();
                d.onclick = (e) => { e.stopPropagation(); d.remove(); onWin(); };
            }
        }
        function onWin() {
            triggerVibe(); snd(523, 0.15);
            const compEl = document.getElementById('g-comp'); const nextBtn = document.getElementById('g-next');
            compEl.innerText = (curLvl === totalLvls) ? "Проверено. Ты идеальна как всегда^-^" : (txts[(curLvl - 1) % txts.length] + ` (Пройдено: ${curLvl}/40) ✨`);
            compEl.classList.remove('hidden'); nextBtn.classList.remove('hidden');
        }
        document.getElementById('g-next').onclick = () => {
            snd(180, 0.2);
            if(curLvl < totalLvls) {
                curLvl++;
                if(curLvl === 31) {
                    document.getElementById('scr-game').classList.remove('active'); document.getElementById('scr-err').classList.add('active');
                    setTimeout(() => { document.getElementById('scr-err').classList.remove('active'); document.getElementById('scr-game').classList.add('active'); startLvl(); }, 2800);
                } else { startLvl(); }
            } else { document.getElementById('scr-game').classList.remove('active'); document.getElementById('scr-final').classList.add('active'); }
        };
        document.getElementById('start-btn').onclick = () => { if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); snd(261, 0.1); document.getElementById('scr-start').classList.remove('active'); document.getElementById('scr-game').classList.add('active'); startLvl(); };
        document.getElementById('f-yes').onclick = () => { snd(600, 0.3); alert('Урааа! Ты самая лучшая на свете! ❤️ Твоя улыбка творит чудеса!'); };
        let no = document.getElementById('f-no');
        no.onmouseover = no.ontouchstart = (e) => { e.preventDefault(); no.style.transform = `translate(${Math.random()*140-70}px, ${Math.random()*100-50}px)`; snd(150, 0.05); };
    </script>
</body>
</html>
